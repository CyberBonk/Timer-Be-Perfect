name: be_perfect
description: "Timer Be Perfect - Android event-coordination app for church student activities."
publish_to: 'none'
version: 2.3.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^3.4.1

  # Firebase Suite
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_database: ^12.4.6
  firebase_messaging: ^16.4.3
  cloud_functions: ^6.3.5

  # Notifications & Timezone
  alarm: ^5.10.0
  flutter_local_notifications: ^22.2.0

  # Utilities & QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.2.3
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.0
  android_intent_plus: ^6.1.0
  intl: ^0.20.2
  real_volume: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/branding/
